    // === ATLETAS ===
    function athleteGames(a){
      const dia=m=>{const i=dayIdxOf(m);if(i>=0)return i;const t=finishTime(m);return t?t/864e5:-1;};
      return a.matches.slice().sort((x,y)=>(dia(y)-dia(x))||(minutesOf(y.time)-minutesOf(x.time))||((y.num||0)-(x.num||0)));
    }
    function sideOfAthlete(m,name){return splitPair(m.player1).includes(name)?1:splitPair(m.player2).includes(name)?2:0;}
    function athleteRow(m,a,compact){
      const k=sideOfAthlete(m,a.name),o=k===1?2:1;
      const st=stateOf(m),lm=st==='live'?liveOf(m):null;
      const sit=liveMatchSituation(m);
      const won=isDone(m)&&m.winner===k,lost=isDone(m)&&m.winner&&m.winner!==k;
      const isFinal=/^final$/i.test(m.roundName||'')&&m.phase!=='group';
      let res,pl;
      if(st==='live'){res='<span class="res live"><span class="dot"></span></span>';pl=livePartial(lm);}
      else if(won){res=isFinal?`<span class="res T">${ic('trophy')}</span>`:'<span class="res V">V</span>';pl=sit?liveSitText(sit):parseSets(m.score).map(p=>p.join('-')).join(' · ');}
      else if(lost){res='<span class="res D">D</span>';pl=sit?liveSitText(sit):parseSets(m.score).map(p=>p.join('-')).join(' · ');}
      else if(isDone(m)){res='<span class="res X">—</span>';pl=sit?liveSitText(sit):'';}
      else{res='<span class="res P">·</span>';pl=m.time?'':'sem horário';}
      const cat=compact?`${(m.drawName||'').replace(/ Principal$/,'')} · ${roundLabel(m.drawName,m.round,m.roundName)}`:`Jogo ${m.num} · ${m.drawName} · ${roundLabel(m.drawName,m.round,m.roundName)}`;
      return `<div class="jr"><span class="h">${esc(m.time||'—')}</span><div><div class="c">${esc(cat)}</div><div class="o"><i>x</i> ${esc(sideName(m,o))}</div></div><span class="pl">${esc(pl||'')}</span>${res}</div>`;
    }
    function renderAthletes(){
      const idx=athletesIndex();
      const q=norm(ui.ath.q);
      const list=q?idx.filter(a=>norm(a.name).includes(q)):idx;
      setHTML($('ath-count'),q?`${list.length} de ${idx.length}`:`${idx.length}`);
      setHTML($('ath-list'),list.length?list.map(a=>`<button class="ar ${a.name===ui.ath.sel?'on':''}" data-ath="${esc(a.name)}"><span class="av">${esc(initials(a.name))}</span><div><b>${esc(a.name)}</b><span>${esc(catsLabel(a.cats)||(validClub(a.club)?a.club:''))}</span></div></button>`).join('')
        :`<div class="muted-box" style="margin-top:8px">Nenhum atleta com esse nome.</div>`);
      const a=idx.find(x=>x.name===ui.ath.sel);
      document.body.classList.toggle('ath-open',!!a);
      if(!a){setHTML($('ath-detail'),emptyState('users','Escolha um atleta','Veja onde ele joga agora, os jogos de cada dia e os títulos.'));return;}
      const games=athleteGames(a);
      const doneG=games.filter(isDone),wins=doneG.filter(m=>m.winner===sideOfAthlete(m,a.name)).length;
      const losses=doneG.filter(m=>m.winner&&m.winner!==sideOfAthlete(m,a.name)).length;
      const titles=drawsList().filter(d=>{const c=championOf(d);return c&&splitPair(c).includes(a.name);}).length;
      const liveG=games.find(m=>stateOf(m)==='live');
      const nextG=pendingQueue().find(m=>sideOfAthlete(m,a.name));
      let strip='';
      if(liveG){
        const lm=liveOf(liveG),k=sideOfAthlete(liveG,a.name),o=k===1?2:1,s=lm&&liveState.scores[lm.id];
        const cur=s?(k===1?`${s.score_p1||0}-${s.score_p2||0}`:`${s.score_p2||0}-${s.score_p1||0}`):'';
        strip=`<div class="now"><div><div class="t">Agora na ${esc(courtOf(liveG,lm)||'quadra')} · ${esc(liveG.drawName)} · ${esc(roundLabel(liveG.drawName,liveG.round,liveG.roundName))}</div>`
          +`<div class="s">x ${esc(sideName(liveG,o))}${s?` · Set ${s.current_set||1}`:''}</div></div><div class="p">${esc(cur)}</div></div>`;
      } else if(nextG){
        const o=sideOfAthlete(nextG,a.name)===1?2:1;
        strip=`<div class="now nextm"><div><div class="t">Próximo jogo · ${esc(nextG.drawName)} · ${esc(roundLabel(nextG.drawName,nextG.round,nextG.roundName))}</div>`
          +`<div class="s">x ${esc(sideName(nextG,o))}${nextG.time?` · ${esc(nextG.time)}`:''}</div></div><div class="p">${ic('clock')}</div></div>`;
      }
      const byDay=[],map={};
      games.forEach(m=>{
        const i=dayIdxOf(m);
        const k=i>=0?days()[i].date:(m.finishedAt||m.startedAt?localKey(m.finishedAt||m.startedAt):'');
        if(!map[k]){map[k]=[];byDay.push(k);}
        map[k].push(m);
      });
      const compact=window.matchMedia('(max-width:760px)').matches;
      const listH=byDay.map(k=>`<div class="dh">${k?esc(dayShort(k)):'Sem dia'}</div>`+map[k].map(m=>athleteRow(m,a,compact)).join('')).join('');
      setHTML($('ath-detail'),`<button class="back" data-ath="">${ic('chevron-left')}Atletas</button>`
        +`<div class="adh"><span class="av">${esc(initials(a.name))}</span><div><h2>${esc(a.name)}</h2>${validClub(a.club)?`<div class="club">${esc(a.club)}</div>`:''}`
        +`<div class="chips">${[...a.cats].sort(byDrawOrder).map(c=>`<span>${esc(c)}</span>`).join('')}</div></div></div>`
        +`<div class="kp"><div><b class="num">${games.length}</b><span>jogos</span></div><div><b class="num">${wins}</b><span>vitórias</span></div><div><b class="num">${losses}</b><span>derrotas</span></div><div><b class="num">${titles}</b><span>${titles===1?'título':'títulos'}</span></div></div>`
        +strip+(listH||`<div class="muted-box">Sem jogos ainda.</div>`));
    }

    // === BUSCAR TORNEIO ===
    // Federacao de cada torneio (t.federations) numa consulta separada. Sem o
    // embed federations(...): o schema staging nao tem FKs e o embed derrubava a
    // consulta de tournaments no live-beta (PGRST200) — mesmo fix do referee (54f083a)
    async function attachFederations(list){
      const ids = [...new Set(list.map(t => t.federation_id).filter(Boolean))];
      if (!ids.length) return list;
      const { data } = await sb.from('federations').select('id,slug,name,short_name,primary_color,logo_url,state,city').in('id', ids);
      const byId = new Map((data || []).map(f => [f.id, f]));
      list.forEach(t => { t.federations = byId.get(t.federation_id) || null; });
      return list;
    }

    // Lista de torneios ativos (atualizados nas ultimas 24h) com info da federacao
    async function fetchActiveTournaments(){
      try{
        const since = new Date(Date.now() - 24*60*60*1000).toISOString();
        const fedSlug = getUrlParam('f');
        const { data, error } = await sb.from('tournaments')
          .select('id,name,federation_id,updated_at')
          .gte('updated_at', since)
          .order('updated_at',{ascending:false});
        if(error)throw error;
        let list = await attachFederations(data || []);
        if (fedSlug) list = list.filter(t => t.federations?.slug === fedSlug);
        activeTournaments = list;
        return list;
      }catch(e){
        console.error('[Live] fetchActiveTournaments:', e);
        activeTournaments = [];
        return [];
      }
    }

    // Carrega 1 torneio especifico (com info da federacao); usado quando ?t=ID
    async function fetchTournamentById(id, includeData){
      try{
        const cols = includeData ? 'id,name,federation_id,data,updated_at' : 'id,name,federation_id';
        const { data, error } = await sb.from('tournaments').select(cols).eq('id', id).maybeSingle();
        if(error)throw error;
        if (data) await attachFederations([data]);
        return data;
      }catch(e){ console.error('[Live] fetchTournamentById:', e); return null; }
    }

    function showHubButton(){
      // Botao "Inicio" sempre visivel (Opcao B): permite acessar a lista de
      // torneios mesmo quando so tem 1 ativo. Auto-load do unico torneio
      // continua acontecendo no init para preservar UX de "abre direto".
      $('nav-hub').style.display='';
    }

    // Torneio atual (com os dados publicados quando includeData)
    let _lastDataAt=0;
    async function getTournament(includeData){
      if (!tournamentId) return null;
      const cols = includeData ? 'id,name,data,updated_at' : 'id,name,updated_at';
      const { data, error } = await sb.from('tournaments').select(cols).eq('id', tournamentId).maybeSingle();
      if(error)throw error;
      if(data){
        tournamentName=data.name||tournamentName;
        if(includeData){tournamentData=data.data||null;_lastDataAt=Date.now();}
        _checkDataConvergence(data.updated_at);
      }
      return data;
    }

    // ═══ Deteccao de pagina desatualizada (convergencia) ═══
    // Finalizacao no realtime implica que o Planner re-publica tournaments.data
    // instantes DEPOIS do evento (debounce ~500ms) — o fetch disparado pelo
    // proprio evento pega dado velho e nao ha evento novo depois (a Tabela de
    // Jogos ficava presa ate o F5). Guarda o timestamp do evento; enquanto o
    // tournaments.updated_at buscado for ANTERIOR a ele, re-tenta em 3s (max 8x).
    let _pendingDataSince=null,_pendingRetries=0,_pendingTimer=null;
    function expectFreshData(ts){
      const t=ts?new Date(ts).getTime():Date.now();
      if(!_pendingDataSince||t>_pendingDataSince){_pendingDataSince=t;_pendingRetries=0;}
    }
    function _checkDataConvergence(updatedAt){
      if(!_pendingDataSince)return;
      const got=updatedAt?new Date(updatedAt).getTime():0;
      if(got>=_pendingDataSince){_pendingDataSince=null;_pendingRetries=0;return;}
      if(_pendingRetries>=8){console.warn('[Live] dado nao convergiu apos retries');_pendingDataSince=null;_pendingRetries=0;return;}
      _pendingRetries++;
      if(!_pendingTimer){_pendingTimer=setTimeout(()=>{_pendingTimer=null;refreshCurrent({data:true});},3000);}
    }

    // Jogos em quadra agora + placares deles
    async function loadLiveState(){
      if(!sb||!tournamentId)return;
      const {data:lm,error}=await sb.from('live_matches').select('*').eq('tournament_id',tournamentId).eq('status','Em Quadra').order('court');
      if(error)throw error;
      let sc=[];
      if(lm?.length){
        const r=await sb.from('live_scores').select('*').in('match_id',lm.map(m=>m.id));
        if(r.error)throw r.error;
        sc=r.data||[];
      }
      const scores={};sc.forEach(s=>{scores[s.match_id]=s;});
      liveState={matches:lm||[],scores};
    }

    // === INICIO: varios torneios ===
    async function loadHub(){
      const cnt=$('hub-content');
      const list=await fetchActiveTournaments();
      if(!list.length){
        setHTML(cnt,emptyState('radio','Nenhum torneio em andamento','Os torneios das federações aparecem aqui no dia dos jogos.'));
        return;
      }
      // Buscar contagem de live_matches por torneio (best-effort)
      const liveCounts={};
      try{
        const { data: lm } = await sb.from('live_matches').select('tournament_id,status').in('tournament_id', list.map(t=>t.id));
        (lm||[]).forEach(m => { if (m.status==='Em Quadra') liveCounts[m.tournament_id] = (liveCounts[m.tournament_id]||0) + 1; });
      }catch(e){}
      setHTML(cnt,list.map(t=>{
        const fed=t.federations||{};
        const n=liveCounts[t.id]||0;
        const logo=fed.logo_url?`<img src="${esc(fed.logo_url)}" alt="">`:esc((fed.short_name||'?').slice(0,4));
        return `<a class="card hc" href="?t=${encodeURIComponent(t.id)}" data-tournament="${esc(t.id)}">`
          +`<div class="fed"><div class="logo" style="color:${esc(fed.primary_color||'#1E3A8A')}">${logo}</div><div><b>${esc(fed.short_name||'-')}</b><span>${esc(fed.city||'')}${fed.city&&fed.state?' - ':''}${esc(fed.state||'')}</span></div></div>`
          +`<h3>${esc(t.name||'Torneio')}</h3>`
          +(n?`<div class="lv"><span class="dot"></span>${n} ${n===1?'jogo':'jogos'} em quadra agora</div>`:`<div class="lv off">Sem jogos em quadra agora</div>`)
          +`<div class="go">Acompanhar →</div></a>`;
      }).join(''));
    }

    // Navegar para um torneio especifico (do inicio)
    async function navigateToTournament(id){
      tournamentId=id;tournamentData=null;liveState={matches:[],scores:{}};
      ui.br.sel=null;ui.br.round=null;ui.sch.day=null;ui.ath.sel=null;
      setUrlTournament(id);
      const t=await fetchTournamentById(id,true);
      if(t){
        applyFederationBranding(t.federations);
        tournamentName=t.name;
        tournamentData=t.data||null;_lastDataAt=Date.now();
      }
      try{await loadLiveState();}catch(e){console.error('[Live] loadLiveState:',e);}
      switchSection('live');
    }

    // === INICIO DA PAGINA ===
    function sectionFromHash(){
      const h=location.hash.replace('#','');
      return Object.keys(SECS).find(k=>SECS[k]===h)||null;
    }
    async function openTournament(t,full){
      tournamentId=t.id;
      applyFederationBranding(t.federations);
      tournamentName=t.name;
      tournamentData=full?.data||null;_lastDataAt=Date.now();
      try{await loadLiveState();}catch(e){console.error('[Live] loadLiveState:',e);}
      const want=sectionFromHash();
      switchSection(want&&want!=='hub'?want:'live');
    }
    async function init(){
      if(_initialized)return; _initialized=true;
      if(!sb){setHTML($('offline'),`${ic('clock')}Não foi possível carregar a página. Confira a internet e recarregue.`);document.body.classList.add('is-offline');return;}
      // Verifica URL param ?t=<id>
      const urlT = getUrlParam('t');
      if (urlT){
        const t = await fetchTournamentById(urlT, true);
        if (t){
          await fetchActiveTournaments();
          showHubButton();
          await openTournament(t,t);
          return;
        }
        // Torneio nao encontrado, cair no fluxo normal
      }
      await fetchActiveTournaments();
      showHubButton();
      if (activeTournaments.length === 1){
        // Auto-selecionar o unico torneio ativo
        const t = activeTournaments[0];
        const full = await fetchTournamentById(t.id, true);
        await openTournament(t,full);
      } else {
        // Nenhum ou varios torneios -> inicio
        applyFederationBranding(null);
        switchSection('hub');
      }
    }

    // Voltar/avancar do browser entre torneios
    window.addEventListener('popstate', async () => {
      const urlT = getUrlParam('t');
      if (urlT && urlT !== tournamentId){
        await navigateToTournament(urlT);
      } else if (!urlT){
        tournamentId = null; tournamentData = null;
        applyFederationBranding(null);
        switchSection('hub');
      }
    });

    // === CLIQUES E BUSCAS ===
    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-sec],[data-go],[data-day],[data-sit],[data-draw],[data-round],[data-rescat],[data-ath],[data-tournament]');
      if(!b)return;
      if(b.dataset.tournament){e.preventDefault();navigateToTournament(b.dataset.tournament);return;}
      if(b.dataset.sec){switchSection(b.dataset.sec);return;}
      if(b.dataset.go){switchSection(b.dataset.go);return;}
      if(b.dataset.day!==undefined){ui.sch.day=Number(b.dataset.day);renderSchedule();return;}
      if(b.dataset.sit){ui.sch.sit=b.dataset.sit;renderSchedule();return;}
      if(b.dataset.draw!==undefined){ui.br.sel=b.dataset.draw;ui.br.round=null;if(currentSection!=='brackets')switchSection('brackets');else renderBrackets();return;}
      if(b.dataset.round){ui.br.round=b.dataset.round;renderBrackets();return;}
      if(b.dataset.rescat!==undefined){ui.res.cat=b.dataset.rescat;renderResults();return;}
      if(b.dataset.ath!==undefined){ui.ath.sel=b.dataset.ath||null;renderAthletes();if(ui.ath.sel&&window.matchMedia('(max-width:760px)').matches)window.scrollTo(0,0);return;}
    });
    $('sch-q').addEventListener('input',e=>{ui.sch.q=e.target.value;renderSchedule();});
    $('sch-court').addEventListener('change',e=>{ui.sch.court=e.target.value;renderSchedule();});
    $('sch-cat').addEventListener('change',e=>{ui.sch.cat=e.target.value;renderSchedule();});
    $('res-q').addEventListener('input',e=>{ui.res.q=e.target.value;renderResults();});
    $('ath-q').addEventListener('input',e=>{ui.ath.q=e.target.value;renderAthletes();});
    $('share').addEventListener('click',async()=>{
      const url=location.href;
      try{
        if(navigator.share){await navigator.share({title:document.title,url});return;}
        await navigator.clipboard.writeText(url);toast('Link copiado');
      }catch(e){if(e&&e.name!=='AbortError')toast('Não deu pra copiar o link');}
    });
    function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}

    // Icones fixos da pagina
    $('share').innerHTML=`${ic('share-2')}<span class="lbl">Compartilhar</span>`;
    $('m-hub').innerHTML=ic('house');
    ['sch-ic','res-ic','ath-ic'].forEach(id=>{$(id).outerHTML=ic('search');});
    document.querySelectorAll('#tabbar [data-sec]').forEach(b=>{const[i,l]=SEC_LABEL[b.dataset.sec];b.innerHTML=`${ic(i)}${l}`;});
    $('offline').innerHTML=`${ic('clock')}Sem conexão no momento — tentando de novo sozinho...`;
    applyFederationBranding(null);
    if(IS_BETA){const tag=document.createElement('span');tag.className='glass';tag.style.cssText='background:#D97706;border-color:#D97706;color:#000;font-weight:700';tag.textContent='BETA';document.querySelector('.nbr').prepend(tag);}
    init();

    // ═══════════════════════════════════════════════════════════
    //  REALTIME + FALLBACK POLLING (mesmo padrão do Planner)
    //  1. Tenta Realtime primeiro
    //  2. Se SUBSCRIBED → para polling
    //  3. Se TIMED_OUT/CHANNEL_ERROR → ativa polling 3s
    //  4. A cada 30s tenta reconectar Realtime
    // ═══════════════════════════════════════════════════════════
    let realtimeChannelMatches=null,realtimeChannelScores=null;
    let pollingInterval=null,realtimeRetryInterval=null;
    let realtimeActive=false;

    // A cada ponto (live_scores) busca so os jogos em quadra; os dados do torneio
    // (programacao, chaves, resultados) vem quando um jogo entra/sai de quadra,
    // termina, ou a cada 20 s. Pedido no meio de outro: roda de novo no fim (antes
    // era descartado e o ultimo ponto podia ficar de fora ate o proximo evento).
    let isLoading=false,_loadingSince=0,_again=false,_againData=false;
    async function refreshCurrent(opts={}){
      // Watchdog: se um fetch fica pendurado (aba suspensa em background, rede
      // dormindo), isLoading travava pra sempre e a pagina parava de atualizar
      // ate o F5. Preso ha >15s = destrava e refaz.
      if(isLoading&&Date.now()-_loadingSince>15000){isLoading=false;}
      if(isLoading){_again=true;_againData=_againData||!!opts.data;return;}
      isLoading=true;_loadingSince=Date.now();
      try{
        if(currentSection==='hub'||!tournamentId){await loadHub();}
        else{
          const wantData=opts.data||!tournamentData||!!_pendingDataSince||Date.now()-_lastDataAt>20000;
          await Promise.all([loadLiveState(),wantData?getTournament(true):null]);
          renderCurrent();
        }
        document.body.classList.remove('is-offline');
      }catch(e){
        console.error('[Live] refresh:',e);
        document.body.classList.add('is-offline');
      }finally{
        isLoading=false;
        if(_again){const d=_againData;_again=false;_againData=false;refreshCurrent({data:d});}
      }
    }

    function startPolling(){
      if(pollingInterval)return;
      console.log('[Live] Polling ativo (3s)');
      pollingInterval=setInterval(()=>refreshCurrent(),3000);
    }

    function stopPolling(){
      if(pollingInterval){
        clearInterval(pollingInterval);
        pollingInterval=null;
        console.log('[Live] Polling parado (Realtime ativo)');
      }
    }

    // Aba voltou ao foco: browsers throttlam timers e derrubam websockets em
    // background — refaz o fetch na hora e reconecta o Realtime, sem esperar F5.
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        isLoading=false;
        refreshCurrent({data:true});
        if(!realtimeActive)setupRealtime();
      }
    });

    function setupRealtime(){
      if(!sb)return startPolling();
      // Limpar channels anteriores
      if(realtimeChannelMatches){sb.removeChannel(realtimeChannelMatches);realtimeChannelMatches=null;}
      if(realtimeChannelScores){sb.removeChannel(realtimeChannelScores);realtimeChannelScores=null;}

      const onChange=(payload)=>{
        // Finalizacao (winner+final_score no live_scores ou status Finalizada no
        // live_matches) = Planner vai re-publicar tournaments.data em seguida —
        // arma a checagem de convergencia pra nao ficar com a tabela velha.
        // O Sem jogo vem sem vencedor (winner 0), so com o final_score.
        const n=payload&&payload.new;
        // Evento de OUTRO torneio: nao precisa buscar nada
        if(n&&n.tournament_id&&tournamentId&&n.tournament_id!==tournamentId&&currentSection!=='hub')return;
        const fin=!!(n&&((n.final_score&&(n.winner||liveParseResult(n.final_score).status==='SemJogo'))||n.status==='Finalizada'));
        if(fin)expectFreshData(n.updated_at);
        refreshCurrent({data:fin||payload?.table==='live_matches'});
      };

      // Channel para live_scores (placares em tempo real)
      realtimeChannelScores=sb.channel('live_scores_'+Date.now())
        .on('postgres_changes',{event:'*',schema:DB_SCHEMA,table:'live_scores'},onChange)
        .subscribe((status)=>{
          console.log('[Live] Realtime scores status:',status);
          if(status==='SUBSCRIBED'){
            realtimeActive=true;
            stopPolling();
            if(realtimeRetryInterval){clearInterval(realtimeRetryInterval);realtimeRetryInterval=null;}
            // Refresh imediato pra pegar estado atual
            refreshCurrent({data:true});
          }
          if(status==='TIMED_OUT'||status==='CHANNEL_ERROR'||status==='CLOSED'){
            realtimeActive=false;
            startPolling();
            scheduleRealtimeRetry();
          }
        });

      // Channel para live_matches (jogos entrando/saindo de quadra)
      realtimeChannelMatches=sb.channel('live_matches_'+Date.now())
        .on('postgres_changes',{event:'*',schema:DB_SCHEMA,table:'live_matches'},onChange)
        .subscribe((status)=>{
          console.log('[Live] Realtime matches status:',status);
        });
    }

    function scheduleRealtimeRetry(){
      if(realtimeRetryInterval)return;
      realtimeRetryInterval=setInterval(()=>{
        console.log('[Live] Tentando reconectar Realtime...');
        setupRealtime();
      },30000);
    }

    // Iniciar
    setupRealtime();
  </script>
</body>
</html>
